# /etc/nginx/sites-available/djswarthy.es (después: ln -s a sites-enabled/)
# nginx vive en el host. El contenedor web-swarthy expone 127.0.0.1:3001.

# HTTP -> redirige a HTTPS (excepto el challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name djswarthy.es www.djswarthy.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://djswarthy.es$request_uri;
    }
}

# HTTPS www -> apex (canónico sin www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;

    return 301 https://djswarthy.es$request_uri;
}

# HTTPS canónico
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;

    # Cabeceras de seguridad
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache largo para los assets de Next.js (immutable hash en el path)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resto del tráfico al contenedor Next
    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSockets (HMR de Next, futuras live features)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
