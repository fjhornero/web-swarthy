# /etc/nginx/sites-available/djswarthy.es (después: ln -s a sites-enabled/)
# nginx vive en el host. El contenedor web-swarthy expone 127.0.0.1:3001.
#
# Las cabeceras de seguridad (HSTS, CSP, X-Frame-Options, Referrer-Policy…)
# las emite la aplicación (next.config.ts) y nginx las deja pasar. No se
# duplican aquí a propósito: dos valores distintos de la misma cabecera dejan
# al navegador decidir cuál aplica.

# Reutiliza la conexión al upstream (menos handshakes TCP por petición).
upstream web_swarthy {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Sólo propagar "Connection: upgrade" cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Límite de peticiones por IP para las server actions (los formularios hacen
# POST a /). Complementa al límite en memoria de la app, que se reinicia con
# cada despliegue.
#
# Sólo cuentan los POST: el map deja la clave vacía en los demás métodos y
# nginx no contabiliza las peticiones cuya clave está vacía. Con la IP como
# clave para todo, las páginas, las imágenes de /_next/image, robots.txt,
# sitemap.xml y las precargas se repartían las mismas 10 peticiones por minuto
# y el exceso recibía un 503: lo pagaban quienes comparten IP (redes móviles)
# y los rastreadores.
#
# La zona no se llama como cuando contaba todas las peticiones (swarthy_forms)
# porque nginx rechaza, al recargar, que una zona con el mismo nombre y tamaño
# cambie de clave: sigue con la configuración anterior y sólo lo dice en el
# error.log, aunque `nginx -t` haya pasado. Si la clave vuelve a cambiar,
# renombra también la zona.
#
# El map y la zona tienen que ir en el contexto http{}: si este fichero se
# incluye desde sites-enabled/ ya lo están.
map $request_method $swarthy_form_posts_key {
    default '';
    POST    $binary_remote_addr;
}

limit_req_zone $swarthy_form_posts_key zone=swarthy_form_posts:10m rate=10r/m;

# HTTP -> redirige a HTTPS (excepto el challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name djswarthy.es www.djswarthy.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://djswarthy.es$request_uri;
    }
}

# HTTPS www -> apex (canónico sin www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://djswarthy.es$request_uri;
}

# HTTPS canónico
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;

    # Las server actions llevan como mucho ~3 KB; los formularios no suben ficheros.
    client_max_body_size 64k;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Cache largo para los assets de Next.js (immutable hash en el path)
    location /_next/static/ {
        proxy_pass http://web_swarthy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las server actions son POST a la propia ruta: se limitan por IP. El resto
    # (navegaciones, imágenes, robots.txt, sitemap.xml) no cuenta para la zona.
    # La ráfaga cubre de sobra a quien corrige un campo y reenvía, y deja que
    # salte antes el límite de la app, más estricto y con su propio aviso.
    # `nodelay` porque sin él nginx encolaría los envíos seguidos a uno cada
    # seis segundos.
    location / {
        limit_req zone=swarthy_form_posts burst=5 nodelay;

        proxy_pass http://web_swarthy;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
