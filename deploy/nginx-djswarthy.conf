# /etc/nginx/sites-available/djswarthy.es (después: ln -s a sites-enabled/)
# nginx vive en el host. El contenedor web-swarthy expone 127.0.0.1:3001.
#
# Las cabeceras de seguridad (HSTS, CSP, X-Frame-Options, Referrer-Policy…)
# las emite la aplicación (next.config.ts) y nginx las deja pasar. No se
# duplican aquí a propósito: dos valores distintos de la misma cabecera dejan
# al navegador decidir cuál aplica.

# Reutiliza la conexión al upstream (menos handshakes TCP por petición).
upstream web_swarthy {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Sólo propagar "Connection: upgrade" cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Límite de peticiones por IP para las server actions (los formularios hacen
# POST a /). Complementa al límite en memoria de la app, que se reinicia con
# cada despliegue. Esta directiva tiene que ir en el contexto http{}: si este
# fichero se incluye desde sites-enabled/ ya lo está.
limit_req_zone $binary_remote_addr zone=swarthy_forms:10m rate=10r/m;

# HTTP -> redirige a HTTPS (excepto el challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name djswarthy.es www.djswarthy.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://djswarthy.es$request_uri;
    }
}

# HTTPS www -> apex (canónico sin www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://djswarthy.es$request_uri;
}

# HTTPS canónico
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name djswarthy.es;

    ssl_certificate     /etc/letsencrypt/live/djswarthy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djswarthy.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;

    # Las server actions llevan como mucho ~3 KB; los formularios no suben ficheros.
    client_max_body_size 64k;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Cache largo para los assets de Next.js (immutable hash en el path)
    location /_next/static/ {
        proxy_pass http://web_swarthy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las server actions son POST a la propia ruta: se limitan por IP. Las
    # navegaciones GET quedan dentro del burst y nunca se bloquean en la práctica.
    location / {
        limit_req zone=swarthy_forms burst=30 nodelay;

        proxy_pass http://web_swarthy;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
