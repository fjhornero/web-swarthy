# docker-compose para web-swarthy
#
# Ajusta el nombre de la red `proxy.name` al de la red en la que vive tu
# contenedor de nginx. Para verla en el servidor:
#   docker network ls
# y luego:
#   docker network inspect <nombre> | grep -A2 Containers
#
# El contenedor NO publica puertos al host: nginx llega a él vía red
# Docker interna. Si tu nginx también vive en docker-compose, basta con
# que comparta esta red. Si nginx vive en el host (no en Docker), cambia
# `expose` por `ports: - "127.0.0.1:3001:3000"` y apunta nginx a 127.0.0.1:3001.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-swarthy:latest
    container_name: web-swarthy
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: nginx_default
