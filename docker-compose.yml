# docker-compose para web-swarthy
#
# Nginx vive en el HOST (no en Docker). El contenedor publica el puerto 3000
# solo al loopback del host (127.0.0.1:3001). Nginx hace proxy_pass a esa
# dirección. No exponemos al exterior — solo nginx puede llegar al servicio.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-swarthy:latest
    container_name: web-swarthy
    restart: unless-stopped
    # tini como PID 1: node no reenvía SIGTERM a sus hijos ni responde bien
    # como init, y sin esto `docker stop` esperaba 10 s y mataba el proceso.
    init: true
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3001:3000"
    # Endurecimiento: sin capacidades de kernel, sin escalada de privilegios
    # y con límites de procesos y memoria para que un bug no se coma el host.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    # Los logs del contenedor son la única traza de los formularios: acotados
    # para que no crezcan sin límite en el disco del servidor.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
