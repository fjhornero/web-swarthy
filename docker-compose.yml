# docker-compose para web-swarthy
#
# Nginx vive en el HOST (no en Docker). El contenedor publica el puerto 3000
# solo al loopback del host (127.0.0.1:3001). Nginx hace proxy_pass a esa
# dirección. No exponemos al exterior — solo nginx puede llegar al servicio.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-swarthy:latest
    container_name: web-swarthy
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
