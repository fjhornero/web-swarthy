name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en el servidor
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: https://djswarthy.es
    steps:
      - name: Configurar clave SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Comprobar acceso al servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          # La causa habitual de un despliegue roto es un known_hosts heredado de
          # un servidor anterior: ssh aborta con "Host key verification failed"
          # sin decir cual de los dos secrets esta mal. Lo comprobamos antes.
          if [ "$DEPLOY_PORT" = "22" ]; then HOST_ENTRY="$DEPLOY_HOST"; else HOST_ENTRY="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          if ! ssh-keygen -F "$HOST_ENTRY" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS no contiene la clave de $HOST_ENTRY. Regeneralo con: ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST"
            exit 1
          fi

          if ! ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
               "$DEPLOY_USER@$DEPLOY_HOST" \
               "test -d '$DEPLOY_PATH/.git' && docker compose version" > /dev/null 2>&1; then
            echo "::error::No se pudo entrar como $DEPLOY_USER, o $DEPLOY_PATH no es un clone git, o el usuario no puede usar docker (grupo docker)."
            exit 1
          fi

      - name: Build y arranque en el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:3001/api/health' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' HEALTH_URL='$HEALTH_URL' TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          PREV_SHA="$(git rev-parse HEAD)"
          echo "==> Commit desplegado ahora mismo: $PREV_SHA"
          echo "==> Commit objetivo:               $TARGET_SHA"

          git fetch --prune origin
          git reset --hard "$TARGET_SHA"

          # La imagen se construye y se queda en este servidor. Sin registry.
          docker compose build
          docker compose up -d --remove-orphans

          echo "==> Esperando healthcheck en $HEALTH_URL"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; then
              echo "==> Servicio sano tras $((i * 3))s"
              docker image prune -f > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done

          echo "==> FALLO: el servicio no responde. Revirtiendo a $PREV_SHA" >&2
          docker compose logs --tail 80 web >&2 || true
          git reset --hard "$PREV_SHA"
          docker compose up -d --build
          exit 1
          REMOTE

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/id_deploy
