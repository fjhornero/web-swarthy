name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 (mismo que el Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restaurar cache de build de Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Build de produccion
        run: npm run build
